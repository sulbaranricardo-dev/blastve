<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blast | Arsenal en Preparación</title>
    <link rel="icon" type="image/png" href="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/Blast%2FCalaveraBlanca(2).png?alt=media&token=89f5df51-fd80-4c68-8e2b-0dabb088a1a5">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --blast-orange: #FFA503; }
        body { background-color: #0a0a0a; color: white; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hero-gym {
            position: relative;
            background: linear-gradient(rgba(10, 10, 10, 0.8), rgba(10, 10, 10, 0.95)), 
                        url('https://i.ibb.co/d4RQbrGt/Store.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .text-orange-blast { color: var(--blast-orange); }
        
        /* Animación de pulso suave para el mensaje */
        .coming-soon-glow {
            text-shadow: 0 0 20px rgba(255, 165, 3, 0.3);
            animation: pulse-glow 3s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }
    </style>
</head>
<body>

    <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[92%] md:w-[85%] glass rounded-2xl z-50 px-6 py-4 flex justify-between items-center">
        <a href="index.html">
            <img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/Blast%2FCalaveraBlanca(2).png?alt=media&token=89f5df51-fd80-4c68-8e2b-0dabb088a1a5" 
                 alt="Isotipo BlastVE" class="w-10 h-10 object-contain">
        </a>
        <div class="text-[10px] font-black uppercase tracking-[0.3em] text-orange-blast italic">
            Zona de Entrenamiento
        </div>
    </nav>

    <section class="min-h-screen flex items-center justify-center relative hero-gym">
        <div class="relative text-center z-10 px-6">
            <img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/Blast%2FBlastOnlyWhite(2).png?alt=media&token=7b7779d2-eb0b-43d9-882a-97899aa7ae49" 
                 alt="BlastVE Logo" class="mx-auto w-64 md:w-[400px] mb-8 opacity-50">
            
            <h1 class="text-4xl md:text-7xl font-black uppercase tracking-tighter mb-6 leading-tight coming-soon-glow">
                PREPARANDO <span class="text-orange-blast">ARSENAL</span>
            </h1>
            
            <p class="text-gray-400 max-w-lg mx-auto mb-10 text-sm md:text-base font-bold tracking-[0.2em] uppercase italic">
                Pronto podrás <span class="text-white">Equiparte</span>
            </p>

            <div class="w-full max-w-xs mx-auto h-1 bg-white/5 rounded-full overflow-hidden mb-4">
                <div class="h-full bg-orange-blast w-3/4 animate-pulse"></div>
            </div>
            <p class="text-[9px] text-gray-600 font-black uppercase tracking-[0.4em]">Sincronizando Inventario de Élite</p>
        </div>
    </section>

    <footer class="fixed bottom-8 w-full text-center">
        <p class="text-gray-600 text-[10px] font-bold tracking-[0.3em] uppercase">© 2026 BlastVE. Powering the athlete.</p>
    </footer>

</body>
</html>
