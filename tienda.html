<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pedido | BlastVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --blast-orange: #FFA503; }
        body { background-color: #0a0a0a; color: white; font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-orange-blast { color: var(--blast-orange); }
        .bg-orange-blast { background-color: var(--blast-orange); }
        .input-blast { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 0.75rem; padding: 1rem; font-size: 0.875rem; color: white; transition: all 0.3s; }
        .input-blast:focus { outline: none; border-color: var(--blast-orange); }
        
        /* Línea de Progreo Mejorada */
        .step-container { position: relative; width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .step-line-bg { position: absolute; top: 50%; left: 0; transform: translateY(-50%); height: 3px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; border-radius: 10px; }
        .step-line-fill { position: absolute; top: 50%; left: 0; transform: translateY(-50%); height: 3px; background: var(--blast-orange); transition: width 0.8s ease; z-index: 2; border-radius: 10px; }
        
        .step-dot { 
            width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; 
            border: 3px solid rgba(255,255,255,0.1); z-index: 10; 
            display: flex; items-center; justify-content: center; 
            font-size: 18px; transition: all 0.4s ease;
        }
        .step-dot.active { border-color: var(--blast-orange); background: var(--blast-orange); color: black; box-shadow: 0 0 20px rgba(255,165,3,0.4); }
        
        .step-label { font-size: 9px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-top: 12px; text-align: center; width: 80px; color: #555; transition: 0.4s; }
        .step-label.active { color: var(--blast-orange); }
    </style>
</head>
<body class="pt-24 flex flex-col min-h-screen">

    <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[92%] md:w-[85%] glass rounded-2xl z-50 px-6 py-3 flex justify-between items-center">
        <a href="index.html"><img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/Blast%2FCalaveraBlanca(2).png?alt=media&token=89f5df51-fd80-4c68-8e2b-0dabb088a1a5" alt="Logo" class="w-10 h-10 object-contain"></a>
        <div class="space-x-8 font-bold uppercase text-[10px] tracking-[0.2em]">
            <a href="index.html" class="hover:text-orange-blast transition">Inicio</a>
            <a href="tienda.html" class="hover:text-orange-blast transition">Tienda</a>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-6 py-10">
        <div class="max-w-4xl mx-auto">
            
            <div id="login-box" class="glass p-12 rounded-[3rem] text-center shadow-2xl animate-fade-in">
                <div class="mb-6"><i class="fas fa-user-check text-5xl text-orange-blast"></i></div>
                <h2 class="text-3xl font-black uppercase mb-2 tracking-tighter italic">MI <span class="text-orange-blast">PEDIDO</span></h2>
                <p class="text-gray-400 text-[10px] mb-10 uppercase tracking-[0.3em] font-bold">Consulta el estatus de tu compra</p>
                <div class="space-y-4 max-w-sm mx-auto">
                    <input type="email" id="login-email" placeholder="Correo Electrónico" class="input-blast text-center">
                    <input type="text" id="login-cedula" placeholder="Cédula (Contraseña)" class="input-blast text-center">
                    <button onclick="consultarPedidos()" class="w-full bg-orange-blast text-black font-black py-4 rounded-xl uppercase tracking-widest hover:scale-[1.02] transition-all shadow-lg shadow-orange-500/20 mt-4">INGRESAR AL PANEL</button>
                    <a href="tienda.html" class="inline-block mt-8 text-[10px] font-bold text-gray-500 uppercase tracking-widest hover:text-white transition italic underline">Seguir Comprando</a>
                </div>
            </div>

            <div id="user-history" class="hidden space-y-10 animate-fade-in">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6 glass p-8 rounded-[2rem]">
                    <div>
                        <h3 class="text-3xl font-black uppercase tracking-tighter">Mis <span class="text-orange-blast">Compras</span></h3>
                        <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">BlastVE Elite Athletes Only</p>
                    </div>
                    <div class="flex gap-4">
                        <a href="tienda.html" class="bg-white/10 hover:bg-orange-blast hover:text-black px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition">Tienda</a>
                        <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition border border-red-500/20">Salir</button>
                    </div>
                </div>

                <div id="pedidos-list" class="space-y-12"></div>
            </div>
        </div>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzosCdNdzT7nkWH6Ofemxk9yf1UnO3kbo6E9Unpdn7NIi3I2akLsx0eAaW1sgScvpugCQ/exec";

        async function consultarPedidos() {
            const email = document.getElementById('login-email').value;
            const cedula = document.getElementById('login-cedula').value;
            if(!email || !cedula) return Swal.fire({ text: 'Por favor, ingresa tus datos', icon: 'warning', background: '#121212', color: '#fff' });

            Swal.fire({ title: 'Rastreando...', didOpen: () => { Swal.showLoading() }, background: '#121212', color: '#fff' });

            try {
                const res = await fetch(`${API_URL}?action=getPedidos&email=${email}&cedula=${cedula}`);
                const data = await res.json();
                Swal.close();

                if(data.length === 0) return Swal.fire({ text: 'No tienes pedidos registrados todavía', icon: 'info', background: '#121212', color: '#fff' });

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('user-history').classList.remove('hidden');
                
                document.getElementById('pedidos-list').innerHTML = data.map(p => {
                    const statusVal = getStatusProgress(p.estatus);
                    return `
                    <div class="glass p-8 md:p-12 rounded-[3rem] border border-white/5 relative overflow-hidden group">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-orange-blast/5 rounded-full blur-3xl -mr-16 -mt-16"></div>

                        <div class="flex flex-col md:flex-row gap-10 items-center">
                            
                            <div class="w-full md:w-1/3 text-center">
                                <div class="relative inline-block">
                                    <div class="w-48 h-48 bg-white/5 rounded-[2rem] overflow-hidden border border-white/10 mx-auto shadow-2xl">
                                        <img src="https://via.placeholder.com/400x400/1a1a1a/ffffff?text=BlastVE+Item" class="w-full h-full object-cover grayscale hover:grayscale-0 transition duration-500">
                                    </div>
                                    <div class="absolute -bottom-4 -right-4 bg-orange-blast text-black font-black px-4 py-2 rounded-xl text-xs shadow-lg uppercase tracking-widest">
                                        $${parseFloat(p.total).toFixed(2)}
                                    </div>
                                </div>
                                <p class="mt-8 text-[10px] text-gray-500 font-bold uppercase tracking-widest">Orden #${p.referencia}</p>
                                <h4 class="text-lg font-black mt-1 uppercase tracking-tighter">${p.fecha}</h4>
                            </div>

                            <div class="w-full md:w-2/3 space-y-12">
                                
                                <div class="step-container px-2">
                                    <div class="step-line-bg"></div>
                                    <div class="step-line-fill" style="width: ${statusVal.percent}%"></div>
                                    
                                    <div class="flex flex-col items-center relative z-10">
                                        <div class="step-dot ${statusVal.step >= 1 ? 'active' : ''}"><i class="fas fa-hourglass-start"></i></div>
                                        <span class="step-label ${statusVal.step >= 1 ? 'active' : ''}">Pedido en Proceso</span>
                                    </div>
                                    <div class="flex flex-col items-center relative z-10">
                                        <div class="step-dot ${statusVal.step >= 2 ? 'active' : ''}"><i class="fas fa-check-circle"></i></div>
                                        <span class="step-label ${statusVal.step >= 2 ? 'active' : ''}">Pago Confirmado</span>
                                    </div>
                                    <div class="flex flex-col items-center relative z-10">
                                        <div class="step-dot ${statusVal.step >= 3 ? 'active' : ''}"><i class="fas fa-truck-fast"></i></div>
                                        <span class="step-label ${statusVal.step >= 3 ? 'active' : ''}">Enviado</span>
                                    </div>
                                    <div class="flex flex-col items-center relative z-10">
                                        <div class="step-dot ${statusVal.step >= 4 ? 'active' : ''}"><i class="fas fa-medal"></i></div>
                                        <span class="step-label ${statusVal.step >= 4 ? 'active' : ''}">Entregado</span>
                                    </div>
                                </div>

                                <div class="bg-white/[0.02] border border-white/5 rounded-[2rem] p-8">
                                    <p class="text-[9px] text-orange-blast font-black uppercase tracking-[0.3em] mb-4">Detalle de Compra</p>
                                    <p class="text-xl md:text-2xl font-black text-gray-100 uppercase leading-tight mb-8">${p.items}</p>
                                    <div class="flex flex-wrap gap-4 items-center">
                                        <span class="bg-orange-blast/10 text-orange-blast px-5 py-2 rounded-full text-[10px] font-black uppercase border border-orange-blast/20">${p.estatus}</span>
                                        <a href="${p.comprobante}" target="_blank" class="text-[10px] font-bold text-gray-400 hover:text-white transition uppercase border-b border-gray-600">Ver Recibo Digital</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { Swal.fire({ text: 'Error de red. Intenta más tarde.', icon: 'error' }); }
        }

        function getStatusProgress(status) {
            const s = status.toLowerCase();
            if (s.includes('entrega') || s.includes('finaliza')) return { step: 4, percent: 100 };
            if (s.includes('envia')) return { step: 3, percent: 66 };
            if (s.includes('paga') || s.includes('confirma')) return { step: 2, percent: 33 };
            return { step: 1, percent: 0 };
        }
    </script>
</body>
</html>
