<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pedido | BlastVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --blast-orange: #FFA503; }
        body { background-color: #0a0a0a; color: white; font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-orange-blast { color: var(--blast-orange); }
        .bg-orange-blast { background-color: var(--blast-orange); }
        
        .input-blast { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 1rem; font-size: 0.875rem; color: white; transition: 0.3s; text-align: center; }
        .input-blast:focus { outline: none; border-color: var(--blast-orange); background: rgba(255,255,255,0.08); }

        .step-container { position: relative; width: 100%; display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
        .step-line-bg { position: absolute; top: 22px; left: 0; height: 3px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; }
        .step-line-fill { position: absolute; top: 22px; left: 0; height: 3px; background: var(--blast-orange); transition: width 1s ease; z-index: 2; }
        .step-item { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 25%; }
        
        .step-dot { 
            width: 45px; height: 45px; border-radius: 50%; background: #1a1a1a; 
            border: 3px solid rgba(255,255,255,0.1); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 16px; transition: all 0.4s ease; color: #555;
        }
        .step-dot.active { border-color: var(--blast-orange); background: var(--blast-orange); color: black; box-shadow: 0 0 20px rgba(255,165,3,0.4); }
        .step-label { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; text-align: center; color: #444; }
        .step-label.active { color: var(--blast-orange); }

        .animate-fade-in { animation: fadeIn 0.5s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Estilo Botón WhatsApp */
        .btn-whatsapp { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); z-index: 100; transition: 0.3s; }
        .btn-whatsapp:hover { transform: scale(1.1); }
    </style>
</head>
<body class="pt-24 flex flex-col min-h-screen">

    <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[92%] md:w-[85%] glass rounded-2xl z-50 px-6 py-3 flex justify-between items-center">
        <a href="index.html"><img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/Blast%2FCalaveraBlanca(2).png?alt=media&token=89f5df51-fd80-4c68-8e2b-0dabb088a1a5" alt="Logo" class="w-10 h-10 object-contain"></a>
        <div class="space-x-8 font-bold uppercase text-[10px] tracking-[0.2em]">
            <a href="index.html" class="hover:text-orange-blast transition">Inicio</a>
            <a href="tienda.html" class="hover:text-orange-blast transition">Tienda</a>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-6 py-10">
        <div class="max-w-4xl mx-auto">
            
            <div id="login-box" class="glass p-12 rounded-[3rem] text-center shadow-2xl animate-fade-in">
                <i class="fas fa-id-card text-5xl text-orange-blast mb-6"></i>
                <h2 class="text-3xl font-black uppercase mb-2 italic">RASTREO <span class="text-orange-blast">ELITE</span></h2>
                <p class="text-gray-400 text-[10px] mb-10 uppercase tracking-[0.3em] font-bold">Introduce tus credenciales</p>
                <div class="space-y-4 max-w-sm mx-auto">
                    <input type="email" id="login-email" placeholder="Correo Electrónico" class="input-blast">
                    <input type="text" id="login-cedula" placeholder="Cédula" class="input-blast">
                    <button onclick="consultarPedidos()" class="w-full bg-orange-blast text-black font-black py-4 rounded-xl uppercase tracking-widest hover:brightness-110 transition shadow-lg shadow-orange-500/20 mt-4">CONSULTAR STATUS</button>
                    <a href="tienda.html" class="inline-block mt-8 text-[10px] font-bold text-gray-500 uppercase tracking-widest hover:text-white transition italic underline">Regresar a la Tienda</a>
                </div>
            </div>

            <div id="user-history" class="hidden space-y-10 animate-fade-in">
                <div class="flex flex-col md:flex-row justify-between items-center gap-6 glass p-8 rounded-[2rem]">
                    <h3 class="text-3xl font-black uppercase tracking-tighter italic">MIS <span class="text-orange-blast">COMPRAS</span></h3>
                    <div class="flex gap-4">
                        <a href="tienda.html" class="bg-white/10 px-8 py-3 rounded-xl text-[10px] font-black uppercase hover:bg-orange-blast hover:text-black transition">Nueva Compra</a>
                        <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-8 py-3 rounded-xl text-[10px] font-black uppercase border border-red-500/20">Salir</button>
                    </div>
                </div>
                <div id="pedidos-list" class="space-y-8"></div>
            </div>
        </div>
    </main>

    <a href="https://wa.me/584241234567" target="_blank" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzosCdNdzT7nkWH6Ofemxk9yf1UnO3kbo6E9Unpdn7NIi3I2akLsx0eAaW1sgScvpugCQ/exec";
        let listadoProductosGlobal = [];

        async function consultarPedidos() {
            const email = document.getElementById('login-email').value;
            const cedula = document.getElementById('login-cedula').value;
            if(!email || !cedula) return Swal.fire({ text: 'Ingresa tus datos', icon: 'warning', background: '#121212', color: '#fff' });

            Swal.fire({ title: 'Buscando Pedidos...', didOpen: () => { Swal.showLoading() }, background: '#121212', color: '#fff' });

            try {
                const resProd = await fetch(API_URL);
                listadoProductosGlobal = await resProd.json();

                const resPed = await fetch(`${API_URL}?action=getPedidos&email=${email}&cedula=${cedula}`);
                const data = await resPed.json();
                Swal.close();

                if(data.length === 0) return Swal.fire({ text: 'No hay pedidos con estos datos', icon: 'info', background: '#121212', color: '#fff' });

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('user-history').classList.remove('hidden');
                
                document.getElementById('pedidos-list').innerHTML = data.map(p => {
                    const statusVal = getStatusProgress(p.estatus);
                    const fotoProducto = buscarImagen(p.items);

                    return `
                    <div class="glass p-6 md:p-8 rounded-[3rem] border border-white/5 relative">
                        <div class="flex flex-col md:flex-row gap-8 items-center">
                            
                            <div class="w-full md:w-1/3 flex flex-col items-center">
                                <div class="relative w-48 h-48">
                                    <div class="w-full h-full bg-white/5 rounded-[2.5rem] overflow-hidden border border-white/10 shadow-2xl">
                                        <img src="${fotoProducto}" class="w-full h-full object-cover">
                                    </div>
                                    <div class="absolute -bottom-3 -right-3 bg-orange-blast text-black font-black px-4 py-2 rounded-xl text-xs shadow-xl uppercase italic">
                                        $${parseFloat(p.total).toFixed(2)}
                                    </div>
                                </div>
                                <div class="mt-6 text-center">
                                     <p class="text-[9px] text-orange-blast font-black uppercase tracking-widest mb-1 italic">Orden #${p.referencia}</p>
                                     <p class="text-xs text-white font-black uppercase">${p.fecha}</p>
                                </div>
                            </div>

                            <div class="w-full md:w-2/3 flex flex-col justify-between">
                                <div class="step-container mb-8">
                                    <div class="step-line-bg"></div>
                                    <div class="step-line-fill" style="width: ${statusVal.percent}%"></div>
                                    
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 1 ? 'active' : ''}"><i class="fas fa-spinner"></i></div>
                                        <span class="step-label ${statusVal.step >= 1 ? 'active' : ''}">Pedido en Proceso</span>
                                    </div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 2 ? 'active' : ''}"><i class="fas fa-check-double"></i></div>
                                        <span class="step-label ${statusVal.step >= 2 ? 'active' : ''}">Pago Confirmado</span>
                                    </div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 3 ? 'active' : ''}"><i class="fas fa-truck-fast"></i></div>
                                        <span class="step-label ${statusVal.step >= 3 ? 'active' : ''}">Enviado</span>
                                    </div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 4 ? 'active' : ''}"><i class="fas fa-box-open"></i></div>
                                        <span class="step-label ${statusVal.step >= 4 ? 'active' : ''}">Entregado</span>
                                    </div>
                                </div>

                                <div class="bg-white/[0.03] rounded-[2rem] p-6 border border-white/5">
                                    <h4 class="text-lg font-black text-white uppercase leading-tight mb-4">${p.items}</h4>
                                    <div class="flex justify-between items-center pt-4 border-t border-white/5">
                                        <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">${p.estatus}</span>
                                        <a href="${p.comprobante}" target="_blank" class="text-[10px] font-black text-orange-blast uppercase hover:underline">Ver Comprobante</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { Swal.fire({ text: 'Error de conexión', icon: 'error' }); }
        }

        function buscarImagen(itemsString) {
            const primerProducto = listadoProductosGlobal.find(p => itemsString.toUpperCase().includes(p.nombre.toUpperCase()));
            return primerProducto ? primerProducto.imagen_url : 'https://via.placeholder.com/400x400/1a1a1a/ffffff?text=BlastVE';
        }

        function getStatusProgress(status) {
            const s = status.toLowerCase();
            if (s.includes('entrega') || s.includes('finaliza')) return { step: 4, percent: 100 };
            if (s.includes('envia')) return { step: 3, percent: 66 };
            if (s.includes('paga') || s.includes('confirma')) return { step: 2, percent: 33 };
            return { step: 1, percent: 0 };
        }
    </script>
</body>
</html>
