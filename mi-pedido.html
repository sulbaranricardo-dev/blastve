<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pedido | BlastVE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --blast-orange: #FFA503; }
        body { background-color: #0a0a0a; color: white; font-family: 'Montserrat', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-orange-blast { color: var(--blast-orange); }
        .bg-orange-blast { background-color: var(--blast-orange); }
        
        /* Input */
        .input-blast { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 1rem; padding: 0.8rem; font-size: 0.875rem; color: white; transition: 0.3s; text-align: center; }
        .input-blast:focus { outline: none; border-color: var(--blast-orange); }

        /* Línea de Rastreo Compacta */
        .step-container { position: relative; width: 100%; display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; }
        .step-line-bg { position: absolute; top: 18px; left: 0; height: 2px; background: rgba(255,255,255,0.1); width: 100%; z-index: 1; }
        .step-line-fill { position: absolute; top: 18px; left: 0; height: 2px; background: var(--blast-orange); transition: width 1s ease; z-index: 2; }
        .step-item { position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; width: 25%; }
        
        .step-dot { 
            width: 36px; height: 36px; border-radius: 50%; background: #1a1a1a; 
            border: 2px solid rgba(255,255,255,0.1); 
            display: flex; align-items: center; justify-content: center; 
            font-size: 14px; transition: all 0.4s ease; color: #444;
        }
        .step-dot.active { border-color: var(--blast-orange); background: var(--blast-orange); color: black; box-shadow: 0 0 15px rgba(255,165,3,0.3); }
        .step-label { font-size: 7px; font-weight: 800; text-transform: uppercase; margin-top: 8px; text-align: center; color: #555; }
        .step-label.active { color: var(--blast-orange); }

        /* Botón WhatsApp Flotante */
        .btn-whatsapp { position: fixed; bottom: 30px; right: 30px; background-color: #25d366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 25px rgba(37,211,102,0.3); z-index: 100; transition: 0.3s; }
        .btn-whatsapp:hover { transform: scale(1.1) rotate(10deg); }
    </style>
</head>
<body class="pt-20 flex flex-col min-h-screen">

    <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[92%] md:w-[85%] glass rounded-2xl z-50 px-6 py-2 flex justify-between items-center">
        <a href="index.html"><img src="https://firebasestorage.googleapis.com/v0/b/d-clan-athletes.firebasestorage.app/o/Blast%2FCalaveraBlanca(2).png?alt=media&token=89f5df51-fd80-4c68-8e2b-0dabb088a1a5" alt="Logo" class="w-8 h-8 object-contain"></a>
        <div class="space-x-6 font-bold uppercase text-[9px] tracking-widest">
            <a href="index.html" class="hover:text-orange-blast transition">Inicio</a>
            <a href="tienda.html" class="hover:text-orange-blast transition">Tienda</a>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-6">
        <div class="max-w-3xl mx-auto">
            
            <div id="login-box" class="glass p-8 md:p-12 rounded-[2.5rem] text-center shadow-2xl">
                <h2 class="text-2xl font-black uppercase mb-2 italic">MI <span class="text-orange-blast">PEDIDO</span></h2>
                <p class="text-gray-500 text-[9px] mb-8 uppercase tracking-widest">Acceso Clientes BlastVE</p>
                <div class="space-y-3 max-w-xs mx-auto">
                    <input type="email" id="login-email" placeholder="Correo" class="input-blast">
                    <input type="text" id="login-cedula" placeholder="Cédula" class="input-blast">
                    <button onclick="consultarPedidos()" class="w-full bg-orange-blast text-black font-black py-3 rounded-xl uppercase text-xs tracking-widest hover:brightness-110 transition mt-2">ENTRAR</button>
                </div>
            </div>

            <div id="user-history" class="hidden space-y-6">
                <div class="flex justify-between items-center glass p-5 rounded-2xl">
                    <h3 class="text-xl font-black italic">MIS <span class="text-orange-blast">COMPRAS</span></h3>
                    <button onclick="location.reload()" class="text-[9px] font-black text-red-500 uppercase tracking-widest px-3 py-1 border border-red-500/20 rounded-lg">Salir</button>
                </div>
                <div id="pedidos-list" class="space-y-6"></div>
            </div>
        </div>
    </main>

    <a href="https://wa.me/584241234567" target="_blank" class="btn-whatsapp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzosCdNdzT7nkWH6Ofemxk9yf1UnO3kbo6E9Unpdn7NIi3I2akLsx0eAaW1sgScvpugCQ/exec";
        let listadoProductosGlobal = [];

        async function consultarPedidos() {
            const email = document.getElementById('login-email').value;
            const cedula = document.getElementById('login-cedula').value;
            if(!email || !cedula) return;

            Swal.fire({ title: 'Cargando...', showConfirmButton: false, didOpen: () => Swal.showLoading(), background: '#121212', color: '#fff' });

            try {
                const resProd = await fetch(API_URL);
                listadoProductosGlobal = await resProd.json();

                const resPed = await fetch(`${API_URL}?action=getPedidos&email=${email}&cedula=${cedula}`);
                const data = await resPed.json();
                Swal.close();

                if(data.length === 0) return Swal.fire({ text: 'Sin pedidos registrados', icon: 'info', background: '#121212' });

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('user-history').classList.remove('hidden');
                
                document.getElementById('pedidos-list').innerHTML = data.map(p => {
                    const statusVal = getStatusProgress(p.estatus);
                    const fotoProducto = buscarImagen(p.items);

                    return `
                    <div class="glass p-5 md:p-8 rounded-[2rem] border border-white/5 shadow-xl">
                        <div class="flex flex-col md:flex-row gap-6 items-center">
                            
                            <div class="flex-shrink-0">
                                <div class="relative w-32 h-32">
                                    <div class="w-full h-full bg-white/5 rounded-2xl overflow-hidden border border-white/10">
                                        <img src="${fotoProducto}" class="w-full h-full object-cover">
                                    </div>
                                    <div class="absolute -bottom-2 -right-2 bg-orange-blast text-black font-black px-2 py-1 rounded-lg text-[10px]">
                                        $${parseFloat(p.total).toFixed(2)}
                                    </div>
                                </div>
                            </div>

                            <div class="flex-grow w-full space-y-6">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <p class="text-[8px] text-gray-500 font-bold uppercase tracking-widest">Orden #${p.referencia} • ${p.fecha}</p>
                                        <h4 class="text-md font-black text-white uppercase mt-1">${p.items}</h4>
                                    </div>
                                    <a href="${p.comprobante}" target="_blank" class="text-orange-blast text-xs hover:scale-110 transition"><i class="fas fa-file-invoice"></i></a>
                                </div>

                                <div class="step-container">
                                    <div class="step-line-bg"></div>
                                    <div class="step-line-fill" style="width: ${statusVal.percent}%"></div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 1 ? 'active' : ''}"><i class="fas fa-spinner"></i></div>
                                        <span class="step-label ${statusVal.step >= 1 ? 'active' : ''}">Proceso</span>
                                    </div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 2 ? 'active' : ''}"><i class="fas fa-check"></i></div>
                                        <span class="step-label ${statusVal.step >= 2 ? 'active' : ''}">Pago</span>
                                    </div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 3 ? 'active' : ''}"><i class="fas fa-truck"></i></div>
                                        <span class="step-label ${statusVal.step >= 3 ? 'active' : ''}">Enviado</span>
                                    </div>
                                    <div class="step-item">
                                        <div class="step-dot ${statusVal.step >= 4 ? 'active' : ''}"><i class="fas fa-medal"></i></div>
                                        <span class="step-label ${statusVal.step >= 4 ? 'active' : ''}">Listo</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { Swal.fire({ text: 'Error', icon: 'error' }); }
        }

        function buscarImagen(itemsString) {
            const primerProducto = listadoProductosGlobal.find(p => itemsString.toUpperCase().includes(p.nombre.toUpperCase()));
            return primerProducto ? primerProducto.imagen_url : 'https://via.placeholder.com/300?text=BlastVE';
        }

        function getStatusProgress(status) {
            const s = status.toLowerCase();
            if (s.includes('entrega') || s.includes('finaliza')) return { step: 4, percent: 100 };
            if (s.includes('envia')) return { step: 3, percent: 66 };
            if (s.includes('paga') || s.includes('confirma')) return { step: 2, percent: 33 };
            return { step: 1, percent: 0 };
        }
    </script>
</body>
</html>
